<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-label="Four game tiles: a cell, a stock chart, a guitar and a trophy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="0.55" stop-color="#2a1647"/>
      <stop offset="1" stop-color="#3d1a2f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="t1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7aa0"/><stop offset="1" stop-color="#c22c57"/></linearGradient>
    <linearGradient id="t2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3ee39a"/><stop offset="1" stop-color="#138a5a"/></linearGradient>
    <linearGradient id="t3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#d4661c"/></linearGradient>
    <linearGradient id="t4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8892c"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/></filter>
  </defs>
  <rect width="1200" height="680" fill="url(#bg)"/>
  <rect width="1200" height="680" fill="url(#glow)"/>
  <g fill="#fff" opacity="0.5">
    <circle cx="110" cy="90" r="3"/><circle cx="1080" cy="140" r="2.5"/><circle cx="980" cy="560" r="3"/><circle cx="210" cy="590" r="2"/><circle cx="640" cy="70" r="2"/>
  </g>
  <!-- Cell -->
  <g transform="translate(210 250) rotate(-10)" filter="url(#sh)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#t1)"/>
    <path d="M-48 -8 C-50 -50 -10 -62 18 -48 C52 -36 58 6 40 32 C22 58 -22 60 -40 36 C-52 20 -46 6 -48 -8 Z" fill="#fff" opacity="0.92"/>
    <circle cx="2" cy="-2" r="18" fill="#c22c57"/>
    <circle cx="62" cy="-58" r="10" fill="#bfe8ff"/>
    <circle cx="-66" cy="58" r="8" fill="#bfe8ff"/>
  </g>
  <!-- Chart -->
  <g transform="translate(470 210) rotate(5)" filter="url(#sh)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#t2)"/>
    <g fill="#fff">
      <rect x="-70" y="10" width="18" height="50" rx="5"/>
      <rect x="-36" y="-14" width="18" height="60" rx="5" opacity="0.7"/>
      <rect x="-2" y="-30" width="18" height="62" rx="5"/>
      <rect x="32" y="-60" width="18" height="70" rx="5"/>
    </g>
    <path d="M-72 30 L-28 0 L8 -14 L58 -66" fill="none" stroke="#0b3d27" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Guitar -->
  <g transform="translate(730 260) rotate(-6)" filter="url(#sh)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#t3)"/>
    <g transform="rotate(35)">
      <rect x="-7" y="-92" width="14" height="96" rx="4" fill="#3a2414"/>
      <rect x="-12" y="-104" width="24" height="18" rx="5" fill="#3a2414"/>
      <ellipse cx="0" cy="34" rx="40" ry="46" fill="#fff4e0"/>
      <ellipse cx="0" cy="6" rx="30" ry="30" fill="#fff4e0"/>
      <circle cx="0" cy="22" r="11" fill="#3a2414"/>
      <rect x="-14" y="54" width="28" height="6" rx="3" fill="#3a2414"/>
    </g>
  </g>
  <!-- Trophy -->
  <g transform="translate(990 220) rotate(8)" filter="url(#sh)">
    <rect x="-110" y="-110" width="220" height="220" rx="44" fill="url(#t4)"/>
    <path d="M-40 -56 H40 V-14 C40 16 20 32 0 32 C-20 32 -40 16 -40 -14 Z" fill="#fff8e1"/>
    <path d="M-40 -46 C-70 -46 -70 -6 -38 -2 M40 -46 C70 -46 70 -6 38 -2" fill="none" stroke="#fff8e1" stroke-width="9" stroke-linecap="round"/>
    <rect x="-8" y="30" width="16" height="22" fill="#fff8e1"/>
    <rect x="-34" y="50" width="68" height="16" rx="5" fill="#7a5512"/>
  </g>
  <!-- Controller hint -->
  <g transform="translate(600 520)" opacity="0.9">
    <rect x="-150" y="-46" width="300" height="92" rx="46" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.35"/>
    <circle cx="-96" cy="0" r="8" fill="#fff"/><rect x="-108" y="-4" width="24" height="8" rx="4" fill="#fff"/><rect x="-100" y="-12" width="8" height="24" rx="4" fill="#fff"/>
    <circle cx="86" cy="-10" r="9" fill="#ff7aa0"/><circle cx="108" cy="8" r="9" fill="#3ee39a"/>
    <text x="-2" y="8" text-anchor="middle" font-family="Manrope, Arial, sans-serif" font-size="26" font-weight="700" fill="#fff">4 games</text>
  </g>
</svg>
