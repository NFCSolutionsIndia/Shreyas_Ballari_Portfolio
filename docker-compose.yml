services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: portfolio
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['8025:8025', '1025:1025']
volumes:
  pgdata:
